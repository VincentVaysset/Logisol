<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Logisol</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Bandeau de diagnostic — toujours visible dès le chargement de la page,
     indépendant de css/style.css et de tout le reste (styles en inline, pas
     de classe, pas d'attribut "hidden") pour rester lisible même si
     quelque chose plus bas plante. À retirer une fois le diagnostic terminé. -->
<div id="debug-banner"
     style="position:fixed;top:0;left:0;right:0;bottom:auto;max-height:28vh;overflow-y:auto;pointer-events:none;z-index:2147483647;background:#c0392b;color:#ffffff;padding:10px 14px;font:600 13px/1.4 monospace;white-space:pre-wrap;word-break:break-word;box-shadow:0 2px 6px rgba(0,0,0,0.4);">
  Démarrage de Logisol...
</div>
<script>
(function () {
  var el = document.getElementById('debug-banner');
  function stamp() { return new Date().toTimeString().split(' ')[0]; }
  window.__logisolDebug = function (msg) {
    var line = '[' + stamp() + '] ' + msg;
    if (el) el.textContent = line;
    try { console.log('[LOGISOL DEBUG]', msg); } catch (e) {}
  };
  window.addEventListener('error', function (e) {
    var loc = e.filename ? (' (' + String(e.filename).split('/').pop() + ':' + e.lineno + ')') : '';
    window.__logisolDebug('Erreur JS : ' + (e.message || e) + loc);
  });
  window.addEventListener('unhandledrejection', function (e) {
    var reason = e.reason;
    var msg = (reason && reason.message) ? reason.message : String(reason);
    window.__logisolDebug('Promesse rejetée non gérée : ' + msg);
  });
  window.__logisolDebug('Script chargé');
})();
</script>

<!-- Écran de connexion -->
<section id="screen-login" class="screen-login">
  <div class="login-card">
    <h1>Logisol</h1>
    <p class="login-sub">Gestion parcellaire</p>
    <form id="login-form">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" autocomplete="username" required>
      <label for="login-password">Mot de passe</label>
      <input type="password" id="login-password" autocomplete="current-password" required>
      <p id="login-error" class="login-error" hidden></p>
      <button type="submit" id="btn-login" class="btn btn-primary">Se connecter</button>
    </form>
  </div>
</section>

<!-- Écran principal -->
<section id="screen-app" class="screen-app" hidden>
  <header>
    <h1>Logisol</h1>
    <span id="user-email" class="user-email"></span>
    <button id="btn-toggle-view" type="button">📋 Liste</button>
    <button id="btn-logout" type="button">Déconnexion</button>
  </header>

  <div id="map"></div>
  <div id="list-view" class="list-view" hidden></div>

  <div class="fab-row">
    <button id="btn-draw" type="button" class="btn btn-fab">✏️ Dessiner une parcelle</button>
    <button id="btn-import" type="button" class="btn btn-fab btn-fab-secondary">📂 Importer un contour</button>
  </div>
  <input type="file" id="input-geojson" accept=".json,.geojson,application/geo+json,application/json" hidden>

  <!-- Fiche parcelle (panneau) -->
  <div id="fiche-panel" class="fiche-overlay" hidden>
    <div class="fiche-panel">
      <h2 id="fiche-title">Parcelle</h2>
      <div id="fiche-error-banner" class="fiche-error-banner" hidden>
        <span id="fiche-error-text"></span>
        <button type="button" id="fiche-error-close" aria-label="Fermer">✕</button>
      </div>
      <form id="fiche-form">
        <label for="fiche-nom">Nom</label>
        <input type="text" id="fiche-nom" required placeholder="ex: Prairie du bas">

        <label for="fiche-vocation">Vocation</label>
        <select id="fiche-vocation"></select>

        <div id="fiche-culture-wrap" hidden>
          <label for="fiche-culture">Culture (campagne en cours)</label>
          <select id="fiche-culture"></select>

          <div id="fiche-newculture-wrap" class="fiche-newtype" hidden>
            <label for="fiche-newculture-nom">Nom de la nouvelle culture</label>
            <input type="text" id="fiche-newculture-nom" placeholder="ex: Tournesol">
            <label for="fiche-newculture-couleur">Couleur</label>
            <input type="color" id="fiche-newculture-couleur" value="#9a988f">
            <label for="fiche-newculture-famille">Famille</label>
            <select id="fiche-newculture-famille">
              <option value="cereale">Céréale</option>
              <option value="oleagineux">Oléagineux</option>
              <option value="legumineuse">Légumineuse</option>
              <option value="prairie">Prairie</option>
              <option value="autre" selected>Autre</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div style="flex:1">
            <label for="fiche-surface">Surface (ha)</label>
            <input type="number" id="fiche-surface" step="0.01" min="0" required>
          </div>
          <div style="flex:1">
            <label for="fiche-couleur">Couleur</label>
            <input type="color" id="fiche-couleur" value="#3c7a4e">
          </div>
        </div>

        <label for="fiche-notes">Notes</label>
        <textarea id="fiche-notes" rows="3" placeholder="Observations, remarques..."></textarea>

        <div class="fiche-actions">
          <button type="submit" id="f-save" class="btn btn-primary">Enregistrer</button>
          <button type="button" id="fiche-cancel" class="btn btn-secondary">Annuler</button>
          <button type="button" id="fiche-delete" class="btn btn-danger" hidden>Supprimer</button>
        </div>
      </form>
    </div>
  </div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Vérification explicite juste après le chargement du script Leaflet,
  // AVANT tout appel à L.map(...) (qui n'a lieu que plus tard, dans
  // map.js, une fois l'utilisateur authentifié).
  window.__logisolDebug(
    (typeof window.L !== 'undefined')
      ? 'Leaflet chargé (v' + (window.L.version || '?') + ')'
      : 'Leaflet INDISPONIBLE — script non chargé (réseau ? CDN bloqué ?)'
  );
</script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script>
  window.__logisolDebug(
    (typeof window.L !== 'undefined' && window.L.Draw)
      ? 'Leaflet.draw chargé'
      : 'Leaflet.draw INDISPONIBLE'
  );
</script>
<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/auth.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
