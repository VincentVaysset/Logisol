<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Logisol</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Bandeau de diagnostic — toujours visible dès le chargement de la page,
     indépendant de css/style.css et de tout le reste (styles en inline, pas
     de classe, pas d'attribut "hidden") pour rester lisible même si
     quelque chose plus bas plante. À retirer une fois le diagnostic terminé.

     ARCHITECTURE : élément de FLUX NORMAL, premier enfant de <body> (qui est
     un conteneur flex vertical, cf. css/style.css). Il n'est donc NI fixed NI
     absolute : il POUSSE l'en-tête et la carte vers le bas au lieu de les
     recouvrir, et réduit d'autant la hauteur disponible pour le reste.
     Sa hauteur est FIXE (18vh, le contenu défile dedans) et non "auto" :
     sinon chaque ligne de log ajoutée changerait sa hauteur, donc celle de
     la carte juste en dessous, ce qui redéclencherait le ResizeObserver de
     map.js, qui logue... et ainsi de suite (boucle de rétroaction réelle,
     observée en test : "ResizeObserver loop completed with undelivered
     notifications").
     Conséquence : quelle que soit la longueur du message, il lui est
     structurellement impossible d'intercepter le clic d'un bouton — ce que
     ni max-height ni pointer-events:none ne garantissaient de façon fiable. -->
<div id="debug-wrap" style="flex:0 0 auto;display:flex;flex-direction:column;">
  <button id="debug-toggle" type="button"
          style="flex:0 0 auto;border:none;width:100%;text-align:left;background:#8e2b20;color:#fff;padding:4px 14px;font:600 11px/1.3 monospace;cursor:pointer;">
    ▼ Diagnostic (toucher pour replier)
  </button>
  <div id="debug-banner"
       style="flex:0 0 auto;height:12vh;overflow-y:auto;background:#c0392b;color:#ffffff;padding:8px 14px;font:600 12px/1.35 monospace;white-space:pre-wrap;word-break:break-word;box-shadow:0 2px 6px rgba(0,0,0,0.4);">
    Démarrage de Logisol...
  </div>
</div>
<script>
(function () {
  var el = document.getElementById('debug-banner');
  var lines = [];

  function describe(node) {
    if (!node) { return 'null'; }
    if (node === document) { return 'document'; }
    var cls = (node.className && typeof node.className === 'string')
      ? '.' + node.className.trim().split(/\s+/).join('.') : '';
    return (node.tagName || '?') + (node.id ? '#' + node.id : '') + cls;
  }

  // Le bandeau garde les 6 dernières lignes (la plus récente en haut) : pour
  // diagnostiquer un démarrage, une seule ligne ne suffit pas à voir la
  // séquence ni l'étape qui traîne.
  window.__logisolDebug = function (msg) {
    var t = Math.round((window.performance && performance.now) ? performance.now() : 0);
    lines.unshift('[' + t + 'ms] ' + msg);
    if (lines.length > 6) { lines.pop(); }
    if (el) { el.textContent = lines.join('\n'); }
    try { console.log('[LOGISOL DEBUG]', msg); } catch (e) {}
  };

  window.addEventListener('error', function (e) {
    // Avertissement benin du navigateur, sans conséquence fonctionnelle : on
    // l'ignore pour garder le bandeau lisible pour un vrai diagnostic.
    if (e.message && e.message.indexOf('ResizeObserver loop') !== -1) { return; }
    var loc = e.filename ? (' (' + String(e.filename).split('/').pop() + ':' + e.lineno + ')') : '';
    window.__logisolDebug('Erreur JS : ' + (e.message || e) + loc);
  });
  window.addEventListener('unhandledrejection', function (e) {
    var reason = e.reason;
    var msg = (reason && reason.message) ? reason.message : String(reason);
    window.__logisolDebug('Promesse rejetée non gérée : ' + msg);
  });

  // --- Traçage des touchers/clics, en phase de CAPTURE sur document ---
  // Objectif : savoir si un appui sur un bouton atteint seulement le DOM.
  //   * aucune ligne "tap"       -> l'événement n'arrive pas jusqu'au DOM
  //   * "tap -> BUTTON#btn-..."  -> il arrive bien, le problème est ailleurs
  //   * "| dessus: X"            -> un élément X recouvre le point touché
  ['pointerdown', 'click'].forEach(function (type) {
    document.addEventListener(type, function (e) {
      // Un clic PROGRAMMATIQUE (element.click()) a des coordonnées 0,0 :
      // elementFromPoint renverrait alors l'élément du coin haut-gauche et
      // ferait croire à tort à un recouvrement. On ne compare donc la cible
      // au point touché que pour un vrai geste, avec de vraies coordonnées.
      var reel = e.isTrusted && (e.clientX > 0 || e.clientY > 0);
      var dessus = null;
      if (reel) {
        try { dessus = document.elementFromPoint(e.clientX, e.clientY); } catch (err) {}
      }
      window.__logisolDebug(
        type + ' -> ' + describe(e.target) +
        (reel ? '' : ' (synthétique)') +
        ((dessus && dessus !== e.target) ? ' | RECOUVERT PAR: ' + describe(dessus) : '')
      );
    }, true);
  });

  // Repli du journal : sur une tablette, 12vh de logs en permanence, c'est
  // autant de carte en moins. Replié, le bandeau ne garde qu'une barre de
  // titre — et continue d'enregistrer, donc rien n'est perdu.
  var toggle = document.getElementById('debug-toggle');
  if (toggle && el) {
    toggle.addEventListener('click', function () {
      var replie = el.style.display === 'none';
      el.style.display = replie ? 'block' : 'none';
      toggle.textContent = replie
        ? '▼ Diagnostic (toucher pour replier)'
        : '▶ Diagnostic replié (toucher pour afficher)';
    });
  }

  document.addEventListener('DOMContentLoaded', function () { window.__logisolDebug('DOM prêt'); });
  window.addEventListener('load', function () { window.__logisolDebug('page chargée (load)'); });

  window.__logisolDebug('Script chargé');
})();
</script>

<!-- Écran de connexion -->
<section id="screen-login" class="screen-login">
  <div class="login-card">
    <h1>Logisol</h1>
    <p class="login-sub">Gestion parcellaire</p>
    <form id="login-form">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" autocomplete="username" required>
      <label for="login-password">Mot de passe</label>
      <input type="password" id="login-password" autocomplete="current-password" required>
      <p id="login-error" class="login-error" hidden></p>
      <button type="submit" id="btn-login" class="btn btn-primary">Se connecter</button>
    </form>
  </div>
</section>

<!-- Écran principal -->
<section id="screen-app" class="screen-app" hidden>
  <header>
    <h1>Logisol</h1>
    <span id="user-email" class="user-email"></span>
    <button id="btn-logout" type="button">Déconnexion</button>
  </header>

  <!-- Onglets de navigation. En flux normal sous l'en-tête, hors de la carte :
       toujours atteignables, quoi qu'affiche Leaflet. Les trois vues PARTAGENT
       LA MÊME carte Leaflet (#map), qui change simplement de hauteur : deux
       instances Leaflet coûteraient le double en mémoire et en tuiles, et
       chaque correctif de carte serait à faire deux fois. -->
  <nav class="tabs" id="tabs">
    <button type="button" class="tab" data-vue="ferme">🏠 Ferme</button>
    <button type="button" class="tab" data-vue="carte">🗺️ Carte</button>
    <button type="button" class="tab" data-vue="liste">📋 Parcelles</button>
  </nav>

  <!-- Barre d'outils du mode dessin.
       Elle est en FLUX NORMAL, juste sous l'en-tête et AU-DESSUS de #map (donc
       hors de la carte, hors de tout .leaflet-pane) : ni Leaflet, ni
       Leaflet.draw, ni un tracé en cours ne peuvent la recouvrir. Elle répond
       à deux besoins signalés sur le terrain : pouvoir annuler le dernier
       point, et pouvoir SORTIR du mode dessin sans deviner le geste. -->
  <div id="draw-toolbar" class="draw-toolbar" hidden>
    <span id="draw-count" class="draw-count">0 point</span>
    <button id="btn-draw-undo" type="button" class="draw-btn">↩ Annuler le point</button>
    <button id="btn-draw-finish" type="button" class="draw-btn draw-btn-primary">✅ Terminer</button>
    <button id="btn-draw-cancel" type="button" class="draw-btn draw-btn-cancel">✖ Annuler</button>
  </div>
  <p id="draw-hint" class="draw-hint" hidden></p>

  <div id="map"></div>

  <!-- Fil des dernières activités (vue Ferme) : toutes parcelles mélangées,
       les plus récentes en premier. -->
  <div id="feed" class="feed" hidden>
    <div class="feed-head">
      <h2>Dernières activités</h2>
      <button type="button" id="btn-new-intervention" class="btn btn-primary btn-feed-add">➕ Intervention</button>
    </div>
    <div id="feed-list"></div>
  </div>

  <div id="list-view" class="list-view" hidden></div>

  <div class="fab-row" id="fab-carte">
    <button id="btn-locate" type="button" class="btn btn-fab btn-fab-icon" title="Centrer sur ma position">📍</button>
    <button id="btn-fit" type="button" class="btn btn-fab btn-fab-icon" title="Voir toutes mes parcelles">🎯</button>
    <button id="btn-draw" type="button" class="btn btn-fab">✏️ Dessiner</button>
    <button id="btn-import" type="button" class="btn btn-fab btn-fab-secondary">📂 Importer</button>
  </div>
  <input type="file" id="input-geojson" accept=".json,.geojson,application/geo+json,application/json" hidden>

  <!-- Aperçu d'une parcelle, ouvert en tapant son polygone sur la carte.
       Volontairement distinct de la fiche d'édition : au champ, on veut
       d'abord SAVOIR (quelle culture, depuis quand) et AGIR (noter, saisir
       une intervention) ; modifier le contour ou le nom est plus rare et
       reste à un bouton. -->
  <div id="apercu-panel" class="fiche-overlay" hidden>
    <div class="fiche-panel">
      <h2 id="apercu-nom">Parcelle</h2>
      <dl class="apercu-infos">
        <div><dt>Surface</dt><dd id="apercu-surface">—</dd></div>
        <div><dt>Culture en cours</dt><dd id="apercu-culture">—</dd></div>
        <div><dt>Implantée depuis</dt><dd id="apercu-duree">—</dd></div>
        <div><dt>Semée le</dt><dd id="apercu-semis">—</dd></div>
      </dl>
      <h3 class="apercu-sous-titre">Dernières activités sur cette parcelle</h3>
      <div id="apercu-activites" class="apercu-activites"></div>
      <div class="fiche-actions">
        <button type="button" id="apercu-note" class="btn btn-primary">📝 Ajouter une note</button>
        <button type="button" id="apercu-activite" class="btn btn-primary">➕ Nouvelle activité</button>
        <button type="button" id="apercu-modifier" class="btn btn-secondary">✏️ Modifier la parcelle</button>
        <button type="button" id="apercu-fermer" class="btn btn-secondary">Fermer</button>
      </div>
    </div>
  </div>

  <!-- Formulaire d'intervention (création et modification) -->
  <div id="intervention-panel" class="fiche-overlay" hidden>
    <div class="fiche-panel">
      <h2 id="itv-title">Nouvelle intervention</h2>
      <div id="itv-error-banner" class="fiche-error-banner" hidden>
        <span id="itv-error-text"></span>
        <button type="button" id="itv-error-close" aria-label="Fermer">✕</button>
      </div>
      <form id="itv-form">
        <label for="itv-date">Date</label>
        <input type="date" id="itv-date" required>

        <label for="itv-type">Type d'intervention</label>
        <select id="itv-type"></select>

        <div id="itv-newtype-wrap" class="fiche-newtype" hidden>
          <label for="itv-newtype-nom">Nom du nouveau type</label>
          <input type="text" id="itv-newtype-nom" placeholder="ex: Hersage">
          <div class="row">
            <div style="flex:1">
              <label for="itv-newtype-icone">Icône</label>
              <input type="text" id="itv-newtype-icone" value="🔧" maxlength="4">
            </div>
            <div style="flex:1">
              <label for="itv-newtype-couleur">Couleur</label>
              <input type="color" id="itv-newtype-couleur" value="#9a988f">
            </div>
          </div>
        </div>

        <label>Parcelles concernées</label>
        <div class="parcelles-pick">
          <button type="button" id="itv-pick-all" class="btn btn-secondary btn-mini">Tout sélectionner</button>
          <button type="button" id="itv-pick-none" class="btn btn-secondary btn-mini">Tout décocher</button>
          <span id="itv-pick-count" class="pick-count">0 parcelle</span>
        </div>
        <div id="itv-parcelles" class="parcelles-list"></div>

        <div id="itv-champ-produit">
          <label for="itv-produit">Produit</label>
          <input type="text" id="itv-produit" placeholder="ex: Fumier, Ammonitrate 33.5">
          <div class="row">
            <div style="flex:2">
              <label for="itv-quantite">Quantité</label>
              <input type="number" id="itv-quantite" step="0.01" min="0" inputmode="decimal">
            </div>
            <div style="flex:1">
              <label for="itv-unite">Unité</label>
              <select id="itv-unite">
                <option value="">—</option>
                <option value="t">t</option>
                <option value="kg">kg</option>
                <option value="L">L</option>
                <option value="t/ha">t/ha</option>
                <option value="kg/ha">kg/ha</option>
                <option value="L/ha">L/ha</option>
                <option value="u">unités</option>
              </select>
            </div>
          </div>
        </div>

        <div id="itv-champ-materiel">
          <label for="itv-materiel">Matériel utilisé</label>
          <input type="text" id="itv-materiel" placeholder="ex: Épandeur 12 t, tracteur 120 ch">
        </div>

        <div id="itv-champ-duree">
          <label for="itv-duree">Temps passé (heures)</label>
          <input type="number" id="itv-duree" step="0.25" min="0" inputmode="decimal" placeholder="ex: 2.5">
        </div>

        <div id="itv-champ-meteo">
          <label>Météo (relevée automatiquement)</label>
          <div class="meteo-box">
            <span id="itv-meteo-text">—</span>
            <button type="button" id="itv-meteo-refresh" class="btn btn-secondary btn-mini">🔄 Relever</button>
          </div>
        </div>

        <label>Photo</label>
        <div class="photo-box">
          <button type="button" id="itv-photo-btn" class="btn btn-secondary btn-mini">📷 Prendre / choisir</button>
          <button type="button" id="itv-photo-clear" class="btn btn-secondary btn-mini" hidden>🗑 Retirer</button>
          <span id="itv-photo-info" class="photo-info"></span>
        </div>
        <img id="itv-photo-preview" class="photo-preview" alt="" hidden>
        <input type="file" id="itv-photo-input" accept="image/*" capture="environment" hidden>

        <label for="itv-notes">Notes</label>
        <textarea id="itv-notes" rows="3" placeholder="Observations, remarques..."></textarea>

        <div class="fiche-actions">
          <button type="submit" id="itv-save" class="btn btn-primary">Enregistrer</button>
          <button type="button" id="itv-cancel" class="btn btn-secondary">Annuler</button>
          <button type="button" id="itv-delete" class="btn btn-danger" hidden>Supprimer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Fiche parcelle (panneau) -->
  <div id="fiche-panel" class="fiche-overlay" hidden>
    <div class="fiche-panel">
      <h2 id="fiche-title">Parcelle</h2>
      <div id="fiche-error-banner" class="fiche-error-banner" hidden>
        <span id="fiche-error-text"></span>
        <button type="button" id="fiche-error-close" aria-label="Fermer">✕</button>
      </div>
      <form id="fiche-form">
        <label for="fiche-nom">Nom</label>
        <input type="text" id="fiche-nom" required placeholder="ex: Prairie du bas">

        <label for="fiche-vocation">Vocation</label>
        <select id="fiche-vocation"></select>

        <div id="fiche-culture-wrap" hidden>
          <label for="fiche-culture">Culture en place</label>
          <select id="fiche-culture"></select>

          <!-- La date de semis fait la différence entre « luzerne 2026 » et
               « luzerne implantée depuis avril 2023 » : c'est elle qui permet
               d'afficher la durée d'implantation et de suivre une culture qui
               chevauche deux années civiles. -->
          <label for="fiche-datesemis">Date de semis / implantation</label>
          <input type="date" id="fiche-datesemis">
          <p id="fiche-duree-info" class="champ-aide" hidden></p>

          <div id="fiche-newculture-wrap" class="fiche-newtype" hidden>
            <label for="fiche-newculture-nom">Nom de la nouvelle culture</label>
            <input type="text" id="fiche-newculture-nom" placeholder="ex: Tournesol">
            <label for="fiche-newculture-couleur">Couleur</label>
            <input type="color" id="fiche-newculture-couleur" value="#9a988f">
            <label for="fiche-newculture-famille">Famille</label>
            <select id="fiche-newculture-famille">
              <option value="cereale">Céréale</option>
              <option value="oleagineux">Oléagineux</option>
              <option value="legumineuse">Légumineuse</option>
              <option value="prairie">Prairie</option>
              <option value="autre" selected>Autre</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div style="flex:1">
            <label for="fiche-surface">Surface (ha)</label>
            <input type="number" id="fiche-surface" step="0.01" min="0" required>
          </div>
          <div style="flex:1">
            <label for="fiche-couleur">Couleur</label>
            <input type="color" id="fiche-couleur" value="#3c7a4e">
          </div>
        </div>

        <label for="fiche-notes">Notes</label>
        <textarea id="fiche-notes" rows="3" placeholder="Observations, remarques..."></textarea>

        <div class="fiche-actions">
          <button type="submit" id="f-save" class="btn btn-primary">Enregistrer</button>
          <button type="button" id="fiche-cancel" class="btn btn-secondary">Annuler</button>
          <button type="button" id="fiche-delete" class="btn btn-danger" hidden>Supprimer</button>
        </div>
      </form>
    </div>
  </div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>
<script>
  // Vérification explicite juste après le chargement du script Leaflet,
  // AVANT tout appel à L.map(...) (qui n'a lieu que plus tard, dans
  // map.js, une fois l'utilisateur authentifié).
  window.__logisolDebug(
    (typeof window.L !== 'undefined')
      ? 'Leaflet chargé (v' + (window.L.version || '?') + ')'
      : 'Leaflet INDISPONIBLE — script non chargé (réseau ? CDN bloqué ?)'
  );
</script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js" crossorigin="anonymous"></script>
<script>
  window.__logisolDebug(
    (typeof window.L !== 'undefined' && window.L.Draw)
      ? 'Leaflet.draw chargé'
      : 'Leaflet.draw INDISPONIBLE'
  );
</script>
<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/auth.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
