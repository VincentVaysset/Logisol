apply plugin: 'com.android.application'

android {
    namespace "com.logisol.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.logisol.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Incrémenté à chaque build CI via la variable d'env VERSION_CODE
        // (numéro de run GitHub Actions, cf. workflow) — défaut 1 en local.
        versionCode (System.getenv("VERSION_CODE") ? System.getenv("VERSION_CODE").toInteger() : 1)
        versionName (System.getenv("VERSION_NAME") ?: "1.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // Keystore de debug FIXE, committé dans le dépôt (android/app/debug.keystore).
        // Sans ça, chaque run GitHub Actions (VM éphémère, pas de
        // ~/.android/debug.keystore persistant) génère un keystore de debug
        // DIFFÉRENT à chaque build -> Android refuse de mettre à jour l'appli
        // par-dessus l'ancienne (signatures différentes) et l'ancienne version
        // reste seule installée, sans erreur visible. Avec ce fichier fixe,
        // tous les APK debug sont signés à l'identique et les mises à jour
        // par-dessus fonctionnent normalement, comme en local.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Keystore de RELEASE, dédié à Logisol (jamais celui d'Ovilog, ni
        // committé dans le dépôt) : c'est lui qui signe l'APK distribué aux
        // exploitants et vérifié par la mise à jour in-app (voir
        // www/js/maj-apk.js et .github/workflows/build-android.yml).
        // Alimenté par des variables d'environnement, elles-mêmes issues de
        // secrets GitHub — jamais de mot de passe en clair ici. Absent en
        // local (pas de LOGISOL_KEYSTORE_PATH) : buildTypes.release retombe
        // alors sur le comportement par défaut de Gradle, non signé.
        release {
            def ksPath = System.getenv('LOGISOL_KEYSTORE_PATH')
            if (ksPath != null && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv('LOGISOL_KEYSTORE_PASSWORD')
                keyAlias System.getenv('LOGISOL_KEY_ALIAS')
                keyPassword System.getenv('LOGISOL_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            def ksPath = System.getenv('LOGISOL_KEYSTORE_PATH')
            if (ksPath != null && file(ksPath).exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
