name: Deploy to Firebase Hosting (preview web)

# Déploie www/ tel quel sur Firebase Hosting, indépendamment du build
# Android (pas de npm ci/cap sync/Gradle nécessaires — juste les fichiers
# statiques) : quelques secondes, pour tester chaque changement dans un
# navigateur sans repasser par un APK complet à chaque fois.
#
# ⚠️ Piste abandonnée pour l'instant (mise en place du compte de service
# Firebase trop de friction pour le gain actuel) — déclenchement automatique
# sur push retiré exprès pour ne plus polluer l'onglet Actions d'un échec à
# chaque commit. Le fichier est conservé tel quel pour reprendre plus tard :
# il suffira de rajouter le bloc "push:" ci-dessous une fois le secret
# FIREBASE_SERVICE_ACCOUNT_OVILOG_15EF6 mis en place (voir README).
# D'ici là, déclenchement manuel uniquement (onglet Actions -> ce workflow
# -> "Run workflow"), pour tester la piste sans la remettre en automatique.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_OVILOG_15EF6 }}'
          projectId: ovilog-15ef6
          channelId: live
