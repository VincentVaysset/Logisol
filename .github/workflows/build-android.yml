name: Build Android APK

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Nécessaire pour que l'étape "Publier la Release GitHub" ci-dessous
    # puisse créer une release + y attacher l'APK avec le GITHUB_TOKEN
    # fourni automatiquement par Actions (voir "Mises à jour automatiques
    # In-App", portées depuis Ovilog/claude/sheep-herd-android-app-7tlcq1).
    permissions:
      contents: write
    # GitHub Actions interdit toute référence au contexte "secrets" dans un
    # "if:" (job ou step) — "Unrecognized named-value: 'secrets'", constaté
    # à l'exécution. Contournement standard : recopier le secret dans une
    # variable d'environnement ICI (où "secrets" reste autorisé), puis ne
    # tester que cette variable dans les "if:" des étapes ci-dessous.
    env:
      HAS_KEYSTORE_SECRET: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Stamp build version into the web app
        # AVANT cap sync, sinon l'APK emporterait la version « local ».
        # Permet de lire sur la tablette quel build est réellement installé.
        run: |
          cat > www/version.js <<EOF
          window.__LOGISOL_VERSION = {
            build: '${{ github.run_number }}',
            commit: '${{ github.sha }}'.slice(0, 7),
            date: '$(date -u +%Y-%m-%d)'
          };
          EOF
          cat www/version.js

      - name: Sync Capacitor (copy web assets into Android project)
        run: npx cap sync android

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Décoder le keystore de signature (secret GitHub)
        # Absent sur une PR venant d'un fork (les secrets n'y sont jamais
        # exposés) : le fichier n'est alors simplement pas créé, et
        # build.gradle retombe sur un build non signé (cf. commentaire dans
        # android/app/build.gradle) plutôt que d'échouer.
        if: ${{ env.HAS_KEYSTORE_SECRET == 'true' }}
        working-directory: android/app
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > logisol-release.keystore

      - name: Build release APK (signé)
        working-directory: android
        env:
          # versionCode strictement croissant à chaque build (numéro de run
          # GitHub Actions) — voir android/app/build.gradle.
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.0.${{ github.run_number }}"
          # RELATIF AU MODULE :app (android/app/), pas à `working-directory`
          # ci-dessus : file(ksPath), appelé DANS android/app/build.gradle,
          # résout toujours par rapport au dossier de CE module Gradle,
          # jamais par rapport à l'endroit d'où ./gradlew est invoqué. Avec
          # un "app/" en préfixe ici (résolvant alors vers l'inexistant
          # android/app/app/logisol-release.keystore), file(ksPath).exists()
          # renvoyait faux en silence : aucune erreur, mais signingConfig
          # jamais appliqué — Gradle produisait un app-release-unsigned.apk
          # (build "réussi", APK impossible à installer par-dessus
          # l'existant, signalé par Vincent sur la release v53).
          LOGISOL_KEYSTORE_PATH: logisol-release.keystore
          LOGISOL_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LOGISOL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LOGISOL_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Lister l'APK produit (diagnostic)
        # Le build #52 a réussi ("BUILD SUCCESSFUL") mais l'étape d'upload
        # suivante n'a trouvé aucun fichier au chemin figé attendu — cette
        # étape logue le contenu réel du dossier de sortie pour
        # diagnostiquer si ça se reproduit, sans faire échouer le job.
        run: find android/app/build/outputs/apk -type f 2>&1 || true

      - name: Vérifier que l'APK est réellement signé
        # Un keystore mal résolu (chemin relatif faux, ex. la régression du
        # run #53 : LOGISOL_KEYSTORE_PATH pointait vers un fichier
        # inexistant) ne fait PAS échouer `assembleRelease` — Gradle
        # retombe silencieusement sur un app-release-UNSIGNED.apk, "build
        # réussi" en apparence, mais impossible à installer par-dessus
        # l'existant (constaté en usage réel sur la release v53). Dès que
        # le secret keystore est censé être disponible, cette étape
        # échoue explicitement si le seul .apk produit porte encore ce
        # suffixe, plutôt que de laisser un APK non installable partir en
        # Release comme si de rien n'était.
        if: ${{ env.HAS_KEYSTORE_SECRET == 'true' }}
        run: |
          if ls android/app/build/outputs/apk/release/*unsigned*.apk >/dev/null 2>&1; then
            echo "::error::APK non signé produit alors qu'un keystore était attendu — LOGISOL_KEYSTORE_PATH ne résout probablement pas vers le bon fichier (voir commentaire dans ce workflow)."
            exit 1
          fi

      - name: Upload release APK (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: logisol-release-apk-v1.0.${{ github.run_number }}
          # Motif générique plutôt qu'un nom de fichier figé : robuste au
          # nommage exact que produit Gradle (constaté différent du
          # "app-release.apk" attendu lors d'un run précédent).
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publier la Release GitHub (source de la mise à jour in-app)
        # Seulement sur un vrai push (jamais sur une pull_request, qui ne
        # doit ni créer de tag ni publier de release). Contrairement à
        # l'artefact ci-dessus (privé, expire au bout de 30 jours,
        # nécessite une authentification GitHub pour être téléchargé), une
        # vraie Release est publique et permanente : c'est elle qu'interroge
        # le mécanisme de mise à jour in-app (voir verifierMiseAJourDisponible
        # dans www/js/maj-apk.js). Le tag "v<n>" (n = numéro de run,
        # identique au versionCode Android déjà strictement croissant)
        # permet la comparaison numérique côté appli sans fichier de
        # métadonnées séparé. Hors main (branches claude/**, builds de
        # développement), la release est marquée "prerelease" — purement
        # indicatif sur GitHub, elle reste bien détectée par l'appli comme
        # n'importe quelle autre release (même mécanisme qu'Ovilog).
        if: ${{ github.event_name == 'push' && env.HAS_KEYSTORE_SECRET == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          # Sans ceci, l'action crée le tag contre la branche par défaut
          # (main) au lieu du commit réellement buildé.
          target_commitish: ${{ github.sha }}
          name: Logisol 1.0.${{ github.run_number }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          body: |
            Build automatique — ${{ github.ref_name }}@${{ github.sha }}

            ${{ github.event.head_commit.message }}
          files: android/app/build/outputs/apk/release/*.apk
